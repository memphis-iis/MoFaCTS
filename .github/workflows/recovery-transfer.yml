# Approved single corrected retry; remove after result and access cleanup.
name: One-time protected recovery baseline transfer
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Reviewed full main commit SHA (must equal dispatch revision)
        required: true
        type: string
      account_id:
        description: Verified destination AWS account ID (not a credential)
        required: true
        type: string
      role_arn:
        description: Approved temporary mofacts-recovery-transfer role ARN
        required: true
        type: string
      secret_arn:
        description: Exact approved empty recovery secret ARN
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: security-audit-recovery-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'memphis-iis/MoFaCTS' && github.ref == 'refs/heads/main' && github.sha == inputs.expected_commit
    runs-on: ubuntu-24.04
    environment: production-security-audit
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Prepare existing dependencies before binding any credentials
        working-directory: mofacts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          aws --version 2>&1 | grep -q '^aws-cli/2\.'
      - name: Validate, transfer once and compare read-back in memory
        env:
          RECOVERY_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          RECOVERY_ACCOUNT_ID: ${{ inputs.account_id }}
          RECOVERY_ROLE_ARN: ${{ inputs.role_arn }}
          RECOVERY_SECRET_ARN: ${{ inputs.secret_arn }}
          AUDIT_AUTH_FIXTURES_JSON: ${{ secrets.AUDIT_AUTH_FIXTURES_JSON }}
          AUDIT_IMAPS_PASSWORD: ${{ secrets.AUDIT_IMAPS_PASSWORD }}
          AUDIT_REPORT_INGEST_SECRET: ${{ secrets.AUDIT_REPORT_INGEST_SECRET }}
          AUDIT_SSH_HOST: ${{ secrets.AUDIT_SSH_HOST }}
          AUDIT_SSH_USER: ${{ secrets.AUDIT_SSH_USER }}
          AUDIT_SSH_PRIVATE_KEY: ${{ secrets.AUDIT_SSH_PRIVATE_KEY }}
          AUDIT_SSH_KNOWN_HOSTS: ${{ secrets.AUDIT_SSH_KNOWN_HOSTS }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          AUDIT_REPORT_ENCRYPTION_PUBLIC_KEY: ${{ vars.AUDIT_REPORT_ENCRYPTION_PUBLIC_KEY }}
        shell: bash
        run: node mofacts/scripts/security-audit/transfer-recovery-baseline.mjs
