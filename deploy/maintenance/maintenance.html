<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>MoFaCTS Scheduled Maintenance</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #172033;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    main {
      width: min(38rem, 100%);
      padding: clamp(2rem, 7vw, 4rem);
      box-sizing: border-box;
      border: 1px solid #d7dfeb;
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 1rem 3rem rgb(32 50 80 / 10%);
      text-align: center;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      line-height: 1.15;
    }
    p {
      margin: 0.75rem 0 0;
      font-size: 1.1rem;
      line-height: 1.6;
    }
    .time {
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>MoFaCTS is undergoing scheduled maintenance</h1>
    <p>We expect service to be restored by</p>
    <p class="time">12:00 PM Central Time today, August 5, 2026.</p>
    <p>Please try again after that time.</p>
  </main>
</body>
</html>
