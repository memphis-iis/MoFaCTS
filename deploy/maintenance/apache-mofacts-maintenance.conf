<VirtualHost *:80>
  ServerName mofacts.optimallearning.org
  ServerAlias mofacts.optimallearning.org
  DocumentRoot /var/www/mofacts-maintenance

  <Directory /var/www/mofacts-maintenance>
    Require all granted
  </Directory>

  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/maintenance\.html$
  RewriteRule ^ - [R=503,L]
  ErrorDocument 503 /maintenance.html

  Header always set Retry-After "Wed, 05 Aug 2026 17:00:00 GMT"
  Header always set Cache-Control "no-store, max-age=0"
</VirtualHost>

<IfModule mod_ssl.c>
Listen 127.0.0.1:8443 https

<VirtualHost *:443>
  ServerName mofacts.optimallearning.org
  ServerAlias mofacts.optimallearning.org
  DocumentRoot /var/www/mofacts-maintenance

  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined

  <Directory /var/www/mofacts-maintenance>
    Require all granted
  </Directory>

  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/maintenance\.html$
  RewriteRule ^ - [R=503,L]
  ErrorDocument 503 /maintenance.html

  Header always set Retry-After "Wed, 05 Aug 2026 17:00:00 GMT"
  Header always set Cache-Control "no-store, max-age=0"

  SSLCertificateFile /etc/letsencrypt/live/mofacts.optimallearning.org/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/mofacts.optimallearning.org/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>

# Localhost-only operator bypass. Reach this listener only through an
# authenticated SSH tunnel while the public maintenance virtual host remains
# active. It deliberately reuses the normal production TLS and proxy contract
# so browser, SockJS, and resource smoke tests exercise the deployed app.
<VirtualHost 127.0.0.1:8443>
  ServerName mofacts.optimallearning.org
  ServerAlias mofacts.optimallearning.org

  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined

  RequestHeader set X-Forwarded-Proto https
  RequestHeader set X-Forwarded-Port 8443
  Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://mofacts.optimallearning.org; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"

  ProxyPass /websocket ws://127.0.0.1:3000/websocket
  ProxyPassMatch ^/sockjs/(.*)/websocket ws://127.0.0.1:3000/sockjs/$1/websocket

  ProxyPass / http://127.0.0.1:3000/
  ProxyPassReverse / http://127.0.0.1:3000/
  ProxyPreserveHost on

  SetEnv proxy-initial-not-pooled 1
  SetEnv proxy-nokeepalive 1

  SSLCertificateFile /etc/letsencrypt/live/mofacts.optimallearning.org/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/mofacts.optimallearning.org/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
