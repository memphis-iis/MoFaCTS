# Include inside the staging2 HTTPS VirtualHost, before its app catch-all proxy.
# No new public port. Host must remain the already verified staging2 hostname.
ProxyPreserveHost On
ProxyPass "/audit-connection/" "unix:/run/mofacts-audit-connection/http/http.sock|http://localhost/audit-connection/" connectiontimeout=5 timeout=20
ProxyPassReverse "/audit-connection/" "unix:/run/mofacts-audit-connection/http/http.sock|http://localhost/audit-connection/"
ProxyPass "/.well-known/oauth-protected-resource/audit-connection/mcp" "unix:/run/mofacts-audit-connection/http/http.sock|http://localhost/.well-known/oauth-protected-resource/audit-connection/mcp" connectiontimeout=5 timeout=20
ProxyPassReverse "/.well-known/oauth-protected-resource/audit-connection/mcp" "unix:/run/mofacts-audit-connection/http/http.sock|http://localhost/.well-known/oauth-protected-resource/audit-connection/mcp"
ProxyPass "/.well-known/oauth-authorization-server/audit-connection" "unix:/run/mofacts-audit-connection/http/http.sock|http://localhost/.well-known/oauth-authorization-server/audit-connection" connectiontimeout=5 timeout=20
ProxyPassReverse "/.well-known/oauth-authorization-server/audit-connection" "unix:/run/mofacts-audit-connection/http/http.sock|http://localhost/.well-known/oauth-authorization-server/audit-connection"
