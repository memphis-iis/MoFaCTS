# Include inside the staging2 HTTPS VirtualHost, before its app catch-all proxy.
# No new public port. Host must remain the already verified staging2 hostname.
ProxyPreserveHost On
ProxyPass "/audit-connection/" "http://127.0.0.1:8943/audit-connection/" connectiontimeout=5 timeout=20
ProxyPassReverse "/audit-connection/" "http://127.0.0.1:8943/audit-connection/"
ProxyPass "/.well-known/oauth-protected-resource/audit-connection/mcp" "http://127.0.0.1:8943/.well-known/oauth-protected-resource/audit-connection/mcp" connectiontimeout=5 timeout=20
ProxyPassReverse "/.well-known/oauth-protected-resource/audit-connection/mcp" "http://127.0.0.1:8943/.well-known/oauth-protected-resource/audit-connection/mcp"
ProxyPass "/.well-known/oauth-authorization-server/audit-connection" "http://127.0.0.1:8943/.well-known/oauth-authorization-server/audit-connection" connectiontimeout=5 timeout=20
ProxyPassReverse "/.well-known/oauth-authorization-server/audit-connection" "http://127.0.0.1:8943/.well-known/oauth-authorization-server/audit-connection"
